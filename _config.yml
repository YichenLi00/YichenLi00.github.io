# Site
title                    : "Yichen Li"
description              : "Research Scientist Hunyuan@Tencent"
url                      : "https://yichenli00.github.io"
baseurl                  : ""
repository               : "YichenLi00/YichenLi00.github.io"

# Verification
google_site_verification : "_2SVGL-Itsj0nzXH9JLcpvTzXZaZNeuKeGkHySIIIEg"

# Author. Only the fields the templates actually read.
author:
  name          : "Yichen Li"
  email         : "ycli21@cse.cuhk.edu.hk"
  location      : "ShaTin, Hong Kong"
  googlescholar : "https://scholar.google.com/citations?user=ckycnWkAAAAJ"
  github        : "YichenLi00"
  linkedin      : "yichen-li-9395101a0"

# Reading files
include:
  - _pages
exclude:
  - .bundle
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - google_scholar_crawler
  - vendor
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: base

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:title/
timezone: Asia/Shanghai

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

# Mirrors GitHub Pages' own allowlist for local --safe builds.
whitelist:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
  - jemoji
