# Education, work and releases, newest first, as one timeline.
#
# Nested items are things that happened *inside* the entry above them —
# internships during a degree, model releases during the current role. Four
# internships overlap the Ph.D. and one ran during undergrad, so a flat
# chronological list would misrepresent them.
#
# logo     square icon under images/logos/ — all real marks
# role     optional on nested entries; the releases carry just a name and date
# url      optional; makes the entry name a link
# current  renders the node with a filled dot

- org: "Tencent Hunyuan"
  when: "2026.03 — Present"
  role: "Research Scientist, agentic training"
  location: "Shenzhen, China"
  logo: "tencent-hunyuan.svg"
  kind: work
  current: true
  concurrent:
    # Hy3 has no icon of its own — the roundel in its wordmark is the Hunyuan
    # mark, so the releases reuse that.
    - org: "Hy3"
      when: "2026.07"
      logo: "tencent-hunyuan.svg"
      url: "https://huggingface.co/tencent/Hy3"
    - org: "Hy3-preview"
      when: "2026.04"
      logo: "tencent-hunyuan.svg"
      url: "https://hy.tencent.com/research/hy3"

