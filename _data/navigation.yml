# Top nav. Three pages; `match` is the page.url prefix that marks the item
# active, so /publications/ highlights Publications.
main:
  - title: "About"
    url: "/"
    match: "/"

  - title: "Publications"
    url: "/publications/"
    match: "/publications"

  - title: "Contact"
    url: "/contact/"
    match: "/contact"
